[project]
name = "neoarchive-backend"
version = "0.1.0"
description = "Local project and asset service for NeoArchive"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.116",
  "pillow>=11",
  "platformdirs>=4",
  "pydantic>=2.11",
  "pyturso>=0.7,<0.8",
  "uvicorn>=0.35",
  "watchfiles>=1",
]

[project.scripts]
neoarchive-api = "neoarchive.sidecar:main"

[dependency-groups]
dev = [
  "httpx>=0.28",
  "pyinstaller>=6.15",
  "pyright>=1.1.404",
  "pytest>=8.4",
  "ruff>=0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neoarchive"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
