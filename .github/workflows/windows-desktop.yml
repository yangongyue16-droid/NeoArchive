name: Windows desktop build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-desktop.yml"
      - "backend/**"
      - "scripts/prepare-sidecar.mjs"
      - "src/**"
      - "src-tauri/**"
      - "package-lock.json"
      - "package.json"
      - "vite.config.ts"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: "24"
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Prepare toolchains
        shell: pwsh
        run: |
          python -m pip install uv
          rustup update stable
          rustup default stable

      - name: Install dependencies
        run: |
          vp install --frozen-lockfile
          uv sync --project backend --frozen

      - name: Verify source
        run: |
          vp pm audit -- --audit-level=high
          vp check
          vp test
          vp run lint:api
          vp run typecheck:api
          vp run test:api
          vp run api:schema
          vp run api:generate
          vp check

      - name: Build Windows installer
        run: vp run build:desktop

      - uses: actions/upload-artifact@v4
        with:
          name: neoarchive-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
